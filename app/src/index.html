<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>Linkitylink</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app">
        <!-- Edit view -->
        <section id="edit-view" class="view" hidden>
            <header class="view-header">
                <h1>Your Link Card</h1>
                <p class="subtitle">This stays on your device — nothing is uploaded until you publish.</p>
            </header>

            <form id="card-form">
                <div class="avatar avatar-editable" id="photo-preview"></div>
                <button type="button" class="btn btn-secondary" id="choose-photo-btn">Choose Photo</button>

                <label>Name
                    <input type="text" id="field-name" placeholder="Ada Lovelace">
                </label>
                <label>Bio
                    <textarea id="field-bio" rows="2" placeholder="A short bio"></textarea>
                </label>

                <p class="section-label">Links</p>

                <div class="link-entry-form" id="link-import-form">
                    <input type="text" id="import-url" placeholder="Paste a Linktree, lnk.bio, etc. URL">
                    <button type="button" class="btn btn-secondary" id="import-links-btn">Import</button>
                </div>

                <ul class="link-entries" id="link-entries"></ul>

                <div class="link-entry-form">
                    <input type="text" id="new-link-label" placeholder="Label (e.g. Portfolio)" maxlength="40">
                    <input type="text" id="new-link-url" placeholder="URL">
                    <button type="button" class="btn btn-secondary" id="add-link-btn">Add Link</button>
                </div>
                <p class="hint" id="link-limit-hint" hidden>Up to 10 links — remove one to add another.</p>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="btn btn-secondary" id="cancel-edit-btn" hidden>Cancel</button>
                </div>
            </form>
        </section>

        <!-- Card view -->
        <section id="card-view" class="view" hidden>
            <div class="card">
                <div class="avatar" id="card-avatar"></div>
                <h1 class="card-name" id="card-name"></h1>
                <p class="card-bio" id="card-bio"></p>

                <div class="link-list" id="card-links"></div>

                <button type="button" class="btn btn-secondary" id="edit-btn">Edit</button>
                <button type="button" class="btn btn-secondary" id="publish-btn">Get Shareable Link</button>
                <div class="link-row" id="link-row" hidden>
                    <span class="link-text" id="link-text"></span>
                    <button type="button" class="btn btn-secondary btn-copy" id="copy-link-btn">Copy</button>
                </div>
                <button type="button" class="btn btn-primary" id="share-btn">Share</button>
            </div>
        </section>

        <p class="status-msg" id="status-msg"></p>
    </main>
    <script type="module" src="main.js"></script>
</body>
</html>
